host: localhost:8080
info:
  contact: {}
  description: HTTP API for the fraud detection backend.
  title: Fraud Detection API
  version: "1.0"
paths:
  /health:
    get:
      description: Checks PostgreSQL, Redis, and RabbitMQ connectivity.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.healthUpResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/main.healthDownResponse'
      summary: Check API health
      tags:
      - system
  /transactions:
    get:
      description: Returns all transactions in deterministic order.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/transaction.TransactionResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.InternalServerError'
      summary: List transactions
      tags:
      - transactions
    post:
      consumes:
      - application/json
      description: Creates a new transaction for a user.
      parameters:
      - description: Create transaction payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/transaction.CreateTransactionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/transaction.TransactionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ReferencedUserNotExistsError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apidoc.TransactionAlreadyExistsError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.InternalServerError'
      summary: Create transaction
      tags:
      - transactions
  /transactions/{id}:
    delete:
      description: Deletes a transaction by UUID.
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.InvalidTransactionIDError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apidoc.TransactionNotFoundError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.InternalServerError'
      summary: Delete transaction
      tags:
      - transactions
    get:
      description: Returns a single transaction by UUID.
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transaction.TransactionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.InvalidTransactionIDError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apidoc.TransactionNotFoundError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.InternalServerError'
      summary: Get transaction by ID
      tags:
      - transactions
  /transactions/user/{id}:
    get:
      description: Returns transactions for a specific user UUID. Optional from/to
        (RFC3339) filter on created_at; both must be sent together.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Range start RFC3339 (omit with to for all-time list)
        in: query
        name: from
        type: string
      - description: Range end RFC3339 (omit with from for all-time list)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/transaction.TransactionResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.InvalidUserIDError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.InternalServerError'
      summary: List transactions by user
      tags:
      - transactions
  /transactions/user/{id}/detail:
    get:
      description: Returns transactions and bucket summary in one response (same filters
        as separate list/summary calls). Default bucket is day when omitted.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Range start RFC3339 (omit with to for all-time)
        in: query
        name: from
        type: string
      - description: Range end RFC3339 (omit with from for all-time)
        in: query
        name: to
        type: string
      - description: 'Bucket unit: minute|hour|day (default day)'
        in: query
        name: bucket
        type: string
      - description: When true, transactions list and summary use only fraud_status=true
          rows
        in: query
        name: fraud_only
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transaction.userTransactionsDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.InvalidUserIDError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.InternalServerError'
      summary: List user transactions with summary
      tags:
      - transactions
  /transactions/user/{id}/summary:
    get:
      description: Returns bucket-based transaction aggregates for a user. With fraud_only=true,
        only fraud_status=true transactions are included in counts and amounts.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Range start in RFC3339 (omit with to for all-time summary)
        in: query
        name: from
        type: string
      - description: Range end in RFC3339 (omit with from for all-time summary)
        in: query
        name: to
        type: string
      - description: 'Bucket unit: minute|hour|day (empty: day for all-time, minute
          when from/to set)'
        in: query
        name: bucket
        type: string
      - description: When true, aggregate only fraud_status=true transactions
        in: query
        name: fraud_only
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/transaction.transactionSummaryResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.InvalidUserIDError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.InternalServerError'
      summary: Get user transaction summary
      tags:
      - transactions
  /users:
    get:
      description: Returns all users in deterministic order.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/user.UserResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.InternalServerError'
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a new user.
      parameters:
      - description: Create user payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/user.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.InvalidRequestBodyError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apidoc.UserAlreadyExistsError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.InternalServerError'
      summary: Create user
      tags:
      - users
  /users/{id}:
    get:
      description: Returns a single user by UUID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.InvalidUserIDError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apidoc.UserNotFoundError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.InternalServerError'
      summary: Get user by ID
      tags:
      - users
schemes:
- http
swagger: "2.0"
